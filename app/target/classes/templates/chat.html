<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.1/stomp.min.js"></script>
</head>
<body class="bg-light">

<div class="position-fixed top-0 end-0 p-3">
    <span id="statusBadge" class="badge bg-warning">Connecting...</span>
</div>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg w-100" style="max-width: 800px;">

        <div class="card-header text-center bg-primary text-white">
            <h5 class="mb-0">Real-Time Chat Application</h5>
            <small>Connected users can chat in real-time</small>
        </div>

        <div id="chat" class="card-body overflow-auto bg-light" style="height: 400px;">
        <!--  empty space where the msgs will appear later-->
        </div>

        <div class="card-footer">
            <form class="row g-2">
                <div class="col-md-3">
                    <input id="senderInput" type="text" class="form-control" placeholder="Your name">
                </div>
                <div class="col-md-7">
                    <input id="messageInput" type="text" class="form-control" placeholder="Type a message...">
                </div>
                <div class="col-md-2 d-grid">
                    <button id="sendMessage" type="button" class="btn btn-primary" disabled>Send</button>
                </div>
            </form>
        </div>

    </div>
</div>

<script>
    let stompClient = null;
    let currentUser = '';

    function setConnected(connected) {
      document.getElementById('sendMessage').disabled = !connected;
      const statusBadge = document.getElementById('statusBadge');
      if (connected) {
        statusBadge.textContent = 'Connected';
        statusBadge.className = 'badge bg-success';
      } else {
        statusBadge.textContent = 'Disconnected';
        statusBadge.className = 'badge bg-danger';
      }
    }

    function connect() {
      var socket = new SockJS('/chat');
      stompClient = Stomp.over(socket);
      stompClient.connect({}, function(frame) {
        setConnected(true);
        console.log('Connected: ' + frame);

        stompClient.subscribe('/topic/messages', function(message) {
          showMessage(JSON.parse(message.body));
        });
      }, function(error) {
        setConnected(false);
        console.error('Connection error:', error);
      });
    }

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, function (m) {
        return ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[m];
      });
    }

    function showMessage(message) {
      var chat = document.getElementById('chat');
      var messageElement = document.createElement('div');

      const isOwnMessage = message.sender === currentUser;
      const timestamp = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

      messageElement.className = `alert ${isOwnMessage ? 'alert-success text-end ms-auto' : 'alert-secondary'} w-75`;

      messageElement.innerHTML = `
        <div class="fw-bold">${escapeHTML(message.sender)}</div>
        <div>${escapeHTML(message.content)}</div>
        <div class="text-muted small mt-1">${timestamp}</div>
      `;

      chat.appendChild(messageElement);
      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
      var sender = document.getElementById('senderInput').value;
      var content = document.getElementById('messageInput').value;

      if (!sender.trim()) {
        alert('Please enter your name first!');
        document.getElementById('senderInput').focus();
        return;
      }

      if (!content.trim()) {
        alert('Please enter a message!');
        return;
      }

      if (!currentUser) {
        currentUser = sender;
      }

      var chatMessage = {
        sender: sender,
        content: content
      };

      stompClient.send("/app/sendMessage", {}, JSON.stringify(chatMessage));
      document.getElementById('messageInput').value = '';
    }

    document.getElementById('sendMessage').onclick = sendMessage;

    document.getElementById('messageInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        sendMessage();
        e.preventDefault();
      }
    });

    document.getElementById('senderInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('messageInput').focus();
      }
    });

    window.onload = connect;
</script>
</body>
</html>
